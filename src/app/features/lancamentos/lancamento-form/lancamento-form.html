<form [formGroup]="formulario" (ngSubmit)="salvar()" class="row g-2 mb-4">
  <h2>{{ lancamento() ? 'Editar lançamento' : 'Novo lançamento' }}</h2>
  <div class="col-md-6">
    <label class="form-label">Descrição</label>
    <input class="form-control" formControlName="descricao">
    @if (formulario.controls.descricao.touched && formulario.controls.descricao.invalid) {
      <small class="text-danger">Informe de 3 a 200 caracteres.</small>
    }
  </div>
  <div class="col-md-3">
    <label class="form-label">Valor</label>
    <input class="form-control" type="number" step="0.01" min="0.01" formControlName="valor">
  </div>
  <div class="col-md-3">
    <label class="form-label">Data</label>
    <input class="form-control" type="date" formControlName="dataLancamento">
  </div>
  <div class="col-md-6">
    <label class="form-label">Categoria</label>
    <select class="form-select" formControlName="categoriaId">
      <option [ngValue]="null">Selecione</option>
      @for (c of categorias(); track c.id) {
        <option [ngValue]="c.id">
          {{ c.descricao }} ({{ c.tipo }}){{ c.ativa ? '' : ' - histórica/inativa' }}
        </option>
      }
    </select>
  </div>
  <div class="col-md-6">
    <label class="form-label">Observação</label>
    <input class="form-control" formControlName="observacao">
  </div>
  <div class="col-12">
    <button class="btn btn-primary" type="submit" [disabled]="salvando()">
      {{ salvando() ? 'Salvando...' : (lancamento() ? 'Salvar alterações' : 'Cadastrar lançamento') }}
    </button>
    @if (lancamento()) {
      <button class="btn btn-outline-secondary ms-2" type="button" [disabled]="salvando()" (click)="cancelar()">
        Cancelar
      </button>
    }
  </div>
  @if (erro()) { <div class="alert alert-danger">{{ erro() }}</div> }
</form>
